name: GitHub Pages

on:
  push:
    branches: [deploy]
  workflow_dispatch:

# Публикуем собранный dist в ветку gh-pages.
# В Settings → Pages → Source выберите: Deploy from a branch → gh-pages → / (root).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build mock presentation
        run: npm run build
        env:
          VITE_USE_MOCK: 'true'
          VITE_API_URL: ''
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
